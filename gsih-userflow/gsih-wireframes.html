<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>GSIH Wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js" defer></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: {
        sans: ['"IBM Plex Sans"', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'Arial', 'sans-serif'],
        mono: ['"IBM Plex Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace']
      }
    }
  }
};
</script>
<style>
/* Wireframe: grayscale only, single light look by choice (a wireframe is judged on structure, not theme). */
:root { --canvas:#f5f5f5; --ink:#171717; color-scheme: light; }
html, body { background: var(--canvas); color: var(--ink); }
body { font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
.ph { position: relative; background-color:#e5e5e5; border:1px solid #a3a3a3;
  background-image:
    linear-gradient(to top right, transparent calc(50% - .5px), #a3a3a3 calc(50% - .5px), #a3a3a3 calc(50% + .5px), transparent calc(50% + .5px)),
    linear-gradient(to top left, transparent calc(50% - .5px), #a3a3a3 calc(50% - .5px), #a3a3a3 calc(50% + .5px), transparent calc(50% + .5px)); }
.ph > span { position:absolute; left:8px; top:6px; font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:11px; color:#525252; background:#e5e5e5; padding:0 4px; }
#screen { position:relative; }
[hidden] { display:none !important; }
.line { height:8px; border-radius:2px; background:#d4d4d4; }
.chip[aria-pressed="true"] { background:#171717; color:#fff; border-color:#171717; }
.role[aria-pressed="true"] { border-color:#171717; box-shadow: inset 0 0 0 1px #171717; background:#fafafa; }
.role[aria-pressed="true"] .radio { background:#171717; box-shadow: inset 0 0 0 3px #fff; }
.screen-btn[aria-current="true"] { background:#171717; color:#fff; }
.screen-btn[aria-current="true"] .tag { color:#d4d4d4; }
:focus-visible { outline:2px solid #171717; outline-offset:2px; }
@media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>

<div class="min-h-full flex flex-col">
  <!-- Top bar -->
  <header class="sticky z-20 bg-white border-b border-neutral-300" style="top:env(safe-area-inset-top,0px)">
    <div class="px-4 sm:px-6 py-3 flex flex-wrap items-center gap-x-6 gap-y-2">
      <div class="flex items-baseline gap-2">
        <span class="font-semibold tracking-tight">GSIH Wireframes</span>
        <span class="font-mono text-xs text-neutral-500">v0.1 · low-fi</span>
      </div>
      <div class="flex items-center gap-2 ml-auto">
        <span class="text-xs text-neutral-500 hidden sm:inline">Tampilan</span>
        <div class="inline-flex border border-neutral-400 rounded" role="group" aria-label="Lebar layar">
          <button id="vpDesktop" class="px-3 py-1.5 text-sm" aria-pressed="true">Desktop</button>
          <button id="vpMobile" class="px-3 py-1.5 text-sm border-l border-neutral-400" aria-pressed="false">Mobile</button>
        </div>
        <button id="pngBtn" type="button" hidden class="ml-2 inline-flex items-center gap-1.5 border border-neutral-400 rounded px-3 py-1.5 text-sm hover:bg-neutral-100" title="Unduh layar yang sedang tampil sebagai PNG">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Unduh PNG</button>
        <span id="pngMsg" class="text-xs text-neutral-600" role="status" hidden></span>
        <label class="flex items-center gap-2 text-sm ml-2 cursor-pointer select-none">
          <input id="notesToggle" type="checkbox" class="accent-neutral-900" checked>
          Catatan
        </label>
      </div>
    </div>
  </header>

  <div class="flex-1 grid grid-cols-[minmax(0,1fr)] lg:grid-cols-[240px_minmax(0,1fr)]">
    <!-- Flow list -->
    <aside class="min-w-0 bg-white border-b lg:border-b-0 lg:border-r border-neutral-300 lg:sticky lg:self-start lg:h-[calc(100vh-57px)] lg:overflow-y-auto" style="top:calc(57px + env(safe-area-inset-top,0px))">
      <div class="px-4 py-4">
        <p class="font-mono text-[11px] uppercase tracking-wider text-neutral-500 mb-2">User flow</p>
        <nav id="flowNav" class="flex lg:flex-col gap-1 overflow-x-auto lg:overflow-visible pb-1"></nav>
      </div>
    </aside>

    <main class="min-w-0 px-4 sm:px-6 py-6">
      <!-- Flow header -->
      <div class="flex flex-wrap items-end gap-x-6 gap-y-2 mb-4">
        <div class="min-w-0">
          <p id="flowCode" class="font-mono text-xs text-neutral-500"></p>
          <h1 id="flowName" class="text-2xl font-semibold tracking-tight" style="text-wrap:balance"></h1>
          <p id="flowWho" class="text-sm text-neutral-600 mt-1"></p>
        </div>
        <div id="simWrap" class="ml-auto flex items-center gap-2 text-sm">
          <span id="simLabel" class="text-neutral-500">Role simulasi</span>
          <select id="roleSim" class="border border-neutral-400 rounded px-2 py-1.5 bg-white text-sm"></select>
        </div>
      </div>

      <!-- Screen tabs -->
      <div id="screenTabs" class="flex gap-1 overflow-x-auto pb-2 mb-4 border-b border-neutral-300"></div>

      <div id="stage" class="grid gap-6 xl:grid-cols-[minmax(0,1fr)_300px] items-start">
        <!-- Device frame -->
        <div class="min-w-0 flex justify-center">
          <div id="frame" class="w-full bg-white border border-neutral-400 rounded-md shadow-sm overflow-clip transition-[max-width] duration-300" style="max-width:1100px">
            <div class="flex items-center gap-2 px-3 py-2 border-b border-neutral-300 bg-neutral-100">
              <span class="w-2.5 h-2.5 rounded-full border border-neutral-400"></span>
              <span class="w-2.5 h-2.5 rounded-full border border-neutral-400"></span>
              <span class="w-2.5 h-2.5 rounded-full border border-neutral-400"></span>
              <div id="urlBar" class="ml-2 flex-1 min-w-0 truncate font-mono text-xs text-neutral-600 bg-white border border-neutral-300 rounded px-2 py-1"></div>
            </div>
            <div id="screen" class="min-h-[560px]"></div>
          </div>
        </div>

        <!-- Notes -->
        <aside id="notes" class="bg-white border border-neutral-300 rounded-md p-4 text-sm xl:sticky" style="top:calc(80px + env(safe-area-inset-top,0px))"></aside>
      </div>
    </main>
  </div>
</div>

<script>
/* ===== Flow index (sidebar). Flows with an entry in FLOW_DEFS are clickable. ===== */
const FLOWS = [
  ['UF-01','Participant Registration'],['UF-02','Partner Registration'],['UF-03','Registrasi & Pendaftaran Program Startup'],
  ['UF-04','Seleksi & Onboarding Program'],['UF-05','Opportunity Discovery & Job Posting'],['UF-06','Partnership / Pilot Tracking'],
  ['UF-07','Researcher Profile & Knowledge / Collaboration Discovery'],['UF-08','Bagikan Riset'],['UF-09','Diskusi Riset'],
  ['UF-10','Gabung Event'],['UF-11','Proses Matchmaking & Pendanaan'],['UF-12','Reservasi Fasilitas Hub'],
  ['UF-13','Pembatalan Peserta (Drop-out)'],['UF-14','Tambah Role Baru'],['UF-15','Undangan Event untuk Mentor'],
  ['UF-16','Check-in Event'],['UF-17','Redeem Benefit'],['UF-18','Ecosystem Registration (by Invitation)'],
  ['UF-19','Create Program & Approval'],['UF-20','Pelaksanaan & Monitoring Program'],['UF-21','Program Reporting & Impact Tracking'],
  ['UF-22','Spoke Activity & Participant Management'],['UF-23','Buat Event'],['UF-24','Verifikasi & Kurasi Startup'],['UF-25','Kelola Badge']
];
const ROLES = [
  {id:'founder', name:'Startup Founder', desc:'Membangun dan mengembangkan startup'},
  {id:'talent',  name:'Digital Talent', desc:'Mengembangkan skill & karier digital'},
  {id:'sme',     name:'SME Owner', desc:'Mendigitalkan usaha (UMKM)'},
  {id:'researcher', name:'Researcher', desc:'Membagikan riset & mencari kolaborasi'},
  {id:'mentor',  name:'Mentor', desc:'Membimbing peserta (perlu verifikasi Core Team)'}
];
const INTERESTS = {
  founder:['Pendanaan','Go-to-market','Product development','Kemitraan korporasi','Legal & perizinan','Rekrutmen tim'],
  talent:['Data & AI','Software engineering','UI/UX','Digital marketing','Cyber security','Cloud'],
  sme:['Pemasaran online','Pembukuan digital','Marketplace','Pembayaran digital','Branding','Logistik'],
  researcher:['AI & data','Ekonomi digital','Kebijakan publik','IoT','Kesehatan digital','Pendidikan'],
  mentor:['Fundraising','Product','Engineering','Marketing','Legal','Operasional']
};
const NEEDS = {
  founder:['Program inkubasi','Mentoring','Investor','Event networking'],
  talent:['Pelatihan','Sertifikasi','Lowongan kerja','Komunitas'],
  sme:['Pendampingan','Pelatihan','Akses pasar','Pendanaan'],
  researcher:['Kolaborasi riset','Diskusi','Publikasi','Event'],
  mentor:[]
};

/* Shared state. Each flow keeps its own current screen. */
const state = {
  flow:'UF-01', screen:{},
  role:'founder', mentorStatus:'pending',          // UF-01
  partnerType:'funder', partnerStatus:'pending',   // UF-02
  eligible:'yes',                                  // UF-03
  selection:'pass',                                // UF-04
  applyMethod:'link', oppType:'job',               // UF-05
  milestoneReview:'approve',                       // UF-06
  urlCheck:'ok', collabAns:'accept',               // UF-08
  loggedIn:'yes', modDecision:'hide',              // UF-09
  curated:'no', curDecision:'approve',             // UF-10
  funderVerified:'yes', founderConsent:'yes',      // UF-11
  bookChannel:'online', bookApproval:'approve',    // UF-12
  newRole:'founder', mentorReview:'approve',       // UF-14
  mentorAns:'accept',                              // UF-15
  attendMode:'offline', checkinWindow:'open', qrResult:'valid', onsiteQuota:'yes', // UF-16
  voucherStock:'yes', benefitType:'internal',      // UF-17
  linkValid:'yes',                                 // UF-18
  proposer:'spoke', hasBudget:'yes', komdigiDec:'amount', // UF-19 & UF-23
  progView:'table', progFilter:'Semua',            // UF-19 daftar program
  evView:'table', evFilter:'Semua',                // UF-23 daftar event
  vfView:'table', vfFilter:'Semua',                // UF-24 antrean verifikasi
  kgView:'table', kgFilter:'Semua',                // UF-13 kegiatan saya
  usrRole:'Semua', usrLoc:'Semua', usrStatus:'Semua', usrSheet:'closed', // UF-18 pengguna ekosistem
  rpRole:'Semua', rpMode:'Semua', rpHadir:'Semua', // UF-21 peserta laporan
  spSek:'Semua', spKeh:'Semua', spSt:'Semua',      // UF-22 participant program
  arSpoke:'Semua', arProg:'Semua', arProgress:'Semua', // UF-22 activity report (Hub)
  bgStatus:'Semua', bgPoin:'Semua', bgMenu:'none',  // UF-25 badge list
  sdSheet:'closed', sheet:'none',  // sheet = bottom sheet filter yang terbuka (mobile)                                // UF-11 filter direktori (mobile)
  photosOk:'yes', prevReport:'done', eventFormat:'hybrid', verifyDec:'approve' // UF-21, UF-23, UF-24
};
let picks = { interests:new Set(), needs:new Set() };

/* ===== Small UI helpers (wireframe vocabulary) ===== */
const ph = (label, cls='') => `<div class="ph ${cls}" ${label?'':'aria-hidden="true"'}>${label?`<span>${label}</span>`:''}</div>`;
const lines = (n=3, w=['w-full','w-11/12','w-2/3']) => `<div class="space-y-2">${Array.from({length:n},(_,i)=>`<div class="line ${w[i%w.length]}"></div>`).join('')}</div>`;
const btn = (label, go, kind='primary', extra='', attrs='') => {
  const k = kind==='primary' ? 'bg-neutral-900 text-white border-neutral-900 hover:bg-neutral-700'
          : kind==='ghost' ? 'bg-transparent text-neutral-700 border-transparent underline underline-offset-2 hover:text-neutral-900'
          : 'bg-white text-neutral-900 border-neutral-500 hover:bg-neutral-100';
  return `<button type="button" ${go?`data-go="${go}"`:''} ${attrs} class="inline-flex items-center justify-center gap-2 border rounded px-4 py-2 text-sm font-medium ${k} ${extra}">${label}</button>`;
};
const flowLink = (label, flow, kind='secondary') => btn(label, null, kind, '', `data-flow="${flow}"`);
/* Search inputs: label "Cari…" is visually hidden (kept for screen readers) and a search icon sits inside the field. */


/* ===== Generic footer: dipasang otomatis di layar ber-header horizontal (lihat withFooter) ===== */

/* Footer otomatis untuk setiap layar ber-header horizontal (appHeader) tanpa sidebar dan bukan mock email.
   Menu footer = menu header layar tsb (+ "Untuk Partner" di header publik); header tanpa menu memakai menu publik. */
const PUBLIC_MENU = ['Program','Event','Opportunity','Riset'];
const withFooter = (html) => {
  const isApp = html.includes('<span class="font-semibold">GSIH</span></div>\n    <nav class="hidden md:flex');
  if (!isApp || html.includes('w-48 shrink-0 border-r') || html.includes('Kotak masuk')) return html;
  const m = html.match(/<nav class="hidden md:flex[^>]*>([\s\S]*?)<\/nav>/);
  let menu = m ? [...m[1].matchAll(/<span>(.*?)<\/span>/g)].map(x=>x[1]) : [];
  if (!menu.length) menu = PUBLIC_MENU;
  if (menu.join('|') === PUBLIC_MENU.join('|')) menu = [...menu, 'Untuk Partner'];
  return html + siteFooter(menu);
};
const SOCIALS = [['IG','Instagram'],['in','LinkedIn'],['YT','YouTube'],['X','X'],['TT','TikTok']];
const siteFooter = (menu) => `
  <footer class="mt-10 border-t border-neutral-300 bg-neutral-50 px-5 pt-8 pb-6" aria-label="Footer situs">
    <div class="grid gap-8 md:grid-cols-[minmax(0,1.6fr)_minmax(0,1fr)_minmax(0,1fr)]">
      <div class="flex flex-col gap-3 min-w-0">
        <div class="flex items-center gap-2"><div class="ph w-7 h-7 rounded-sm" aria-hidden="true"></div><span class="font-semibold">GSIH</span></div>
        <p class="text-sm text-neutral-600 max-w-xs">Garuda Spark Innovation Hub — satu tempat untuk startup, talenta digital, UMKM, peneliti & mentor.</p>
      </div>
      <nav aria-label="Menu footer" class="flex flex-col gap-2 text-sm">
        <p class="font-mono text-[11px] uppercase tracking-wider text-neutral-500 mb-1">Jelajahi</p>
        ${menu.map(t=>`<a class="text-neutral-700 hover:underline w-fit" href="#" onclick="return false">${t}</a>`).join('')}
      </nav>
      <div class="flex flex-col gap-2">
        <p class="font-mono text-[11px] uppercase tracking-wider text-neutral-500 mb-1">Ikuti kami</p>
        <div class="flex flex-wrap gap-2">${SOCIALS.map(([a,n])=>`<a href="#" onclick="return false" aria-label="${n}" title="${n}" class="w-9 h-9 rounded-full border border-neutral-400 bg-white inline-flex items-center justify-center font-mono text-xs text-neutral-700 hover:border-neutral-900">${a}</a>`).join('')}</div>
      </div>
    </div>
    <div class="mt-8 pt-4 border-t border-neutral-300 text-xs text-neutral-500">© 2026 Garuda Spark Innovation Hub · Kementerian Komunikasi dan Digital</div>
  </footer>`;
/* ===== Mobile filter: tombol Filter + bottom sheet (dipakai semua halaman yang punya filter) ===== */
const FILTER_ICON = `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>`;
const isMob = () => viewport==='mobile';
const mFilterBtn = (id, n=0) => `<button type="button" data-set="sheet:${id}" class="shrink-0 inline-flex items-center gap-2 border ${n?'border-neutral-900 border-2':'border-neutral-400'} rounded px-3 py-2 text-sm bg-white">${FILTER_ICON}Filter${n?` <span class="bg-neutral-900 text-white text-[10px] font-mono rounded-full px-1.5">${n}</span>`:''}</button>`;
const mSearchFilter = (searchHtml, id, n=0) => `<div class="flex items-end gap-2"><div class="flex-1 min-w-0">${searchHtml}</div>${mFilterBtn(id,n)}</div>`;
/* groups: [legend, [[label, count|null, pressed, 'key:value'|null], ...]] */
const mSheet = (id, title, groups, cta, resetSet='') => state.sheet!==id ? '' : `
  <div class="absolute inset-0 z-10 bg-neutral-900/40 flex items-end" role="dialog" aria-label="${title}">
    <div class="w-full bg-white rounded-t-xl border-t border-neutral-900 px-5 pt-2 pb-5 flex flex-col gap-4 max-h-[85%] overflow-y-auto">
      <span class="self-center w-10 h-1 rounded-full bg-neutral-300" aria-hidden="true"></span>
      <div class="flex items-center"><h3 class="font-semibold">${title}</h3><button type="button" data-set="sheet:none" class="ml-auto text-neutral-500" aria-label="Tutup">✕</button></div>
      ${groups.map(([lg,chips])=>`<fieldset><legend class="text-sm font-medium mb-2">${lg}</legend><div class="flex flex-wrap gap-2">${chips.map(([l,c,p,st])=>`<button type="button" ${st?`data-set="${st}"`:''} class="chip border border-neutral-400 rounded-full px-3 py-1 text-sm" aria-pressed="${!!p}">${l}${c!=null?` <span class="font-mono text-xs opacity-70">${c}</span>`:''}</button>`).join('')}</div></fieldset>`).join('')}
      <div class="flex gap-3 border-t border-neutral-200 pt-4">${btn('Reset',null,'secondary','',resetSet?`data-set="${resetSet}"`:'')}${btn(cta,null,'primary','flex-1','data-set="sheet:none"')}</div>
    </div>
  </div>`;

/* Responsive list: table on desktop, card list on mobile (first column = title, "Aksi"/last empty header = footer action) */
const rTable = (heads, rows, minw='min-w-[560px]') => !isMob() ? table(heads, rows, minw) : `
  <ul class="flex flex-col gap-3">${rows.map(r=>{ const actIdx = heads.findIndex(h=>h===''||h==='Aksi'); return `
    <li class="border border-neutral-300 rounded p-4 flex flex-col gap-2 min-w-0">
      <div class="text-sm font-medium">${r[0]}</div>
      <dl class="grid grid-cols-[auto_minmax(0,1fr)] gap-x-4 gap-y-1 text-sm">${heads.map((h,i)=> i===0||i===actIdx ? '' : `<dt class="text-xs text-neutral-500 self-center">${h}</dt><dd class="min-w-0">${r[i]}</dd>`).join('')}</dl>
      ${actIdx>0 && r[actIdx] && r[actIdx]!=='—' ? `<div class="border-t border-neutral-200 pt-2">${r[actIdx]}</div>` : ''}
    </li>`; }).join('')}</ul>`;
/* Search + filter toolbar: desktop = search + dropdowns, mobile = search + Filter button + bottom sheet */
const fSelect = (id, label, opts) => `<div class="flex flex-col gap-1 min-w-0"><label for="${id}" class="sr-only">${label}</label><select id="${id}" class="border border-neutral-400 rounded px-3 py-2 text-sm bg-white">${opts.map(o=>`<option>${label}: ${o}</option>`).join('')}</select></div>`;
const listTools = (id, searchHtml, filters, cta, title='Filter') => isMob()
  ? mSearchFilter(searchHtml, id) + mSheet(id, title, filters.map(([lb,opts])=>[lb, opts.map((o,i)=>[o, null, i===0])]), cta)
  : `<div class="flex flex-wrap items-end gap-3"><div class="w-full sm:w-56">${searchHtml}</div>${filters.map(([lb,opts],i)=>fSelect(id+'F'+i, lb, opts)).join('')}</div>`;
/* Status filter (state-backed) -> sheet chips */
const statusChips = (key, ST, countFn) => ST.map(x=>[x, countFn(x), state[key]===x, `${key}:${x}`]);
const searchIcon = `<svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-neutral-500 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>`;
const field = (id,label,type='text',ph='',hint='',value='') => {
  const s = type==='search', hideLabel = s && /^Cari/.test(label);
  return `
  <div class="flex flex-col gap-1 min-w-0">
    <label for="${id}" class="${hideLabel?'sr-only':'text-sm font-medium'}">${label}</label>
    <div class="relative">${s?searchIcon:''}<input id="${id}" type="${type}" placeholder="${ph}" ${value?`value="${value}"`:''} class="w-full border border-neutral-400 rounded ${s?'pl-9 pr-3':'px-3'} py-2 text-sm bg-white placeholder:text-neutral-400"></div>
    ${hint?`<span class="text-xs text-neutral-500">${hint}</span>`:''}
  </div>`;
};
const area = (id,label,ph='',rows=3) => `
  <div class="flex flex-col gap-1 min-w-0">
    <label for="${id}" class="text-sm font-medium">${label}</label>
    <textarea id="${id}" rows="${rows}" placeholder="${ph}" class="border border-neutral-400 rounded px-3 py-2 text-sm bg-white placeholder:text-neutral-400"></textarea>
  </div>`;
const select = (id,label,opts) => `
  <div class="flex flex-col gap-1 min-w-0"><label for="${id}" class="text-sm font-medium">${label}</label>
    <select id="${id}" class="border border-neutral-400 rounded px-3 py-2 text-sm bg-white">${opts.map(o=>`<option>${o}</option>`).join('')}</select></div>`;
const upload = (label, hint) => `
  <div class="border border-dashed border-neutral-500 rounded p-3 text-sm flex flex-wrap items-center gap-3">
    ${ph('','w-8 h-10')}<div class="min-w-0"><p class="font-medium">${label}</p><p class="text-xs text-neutral-500">${hint}</p></div>
    ${btn('Pilih file',null,'secondary','ml-auto')}</div>`;
const prefilled = () => `<span class="font-mono text-[10px] border border-neutral-400 rounded px-1 py-px text-neutral-600 ml-1">dari profil</span>`;
const pill = (t, dark=false) => `<span class="font-mono text-[11px] border ${dark?'bg-neutral-900 text-white border-neutral-900':'border-neutral-900'} rounded px-2 py-0.5 whitespace-nowrap w-fit">${t}</span>`;
const checkRow = (t, done, sub='') => `<li class="flex items-start gap-3"><span class="w-4 h-4 mt-0.5 shrink-0 border ${done?'bg-neutral-900 border-neutral-900':'border-neutral-400'} rounded-sm"></span><span class="min-w-0"><span class="text-sm ${done?'':'font-medium'}">${t}</span>${sub?`<span class="block text-xs text-neutral-500">${sub}</span>`:''}</span></li>`;
const simBar = (label, key, opts) => `

/* Countdown H-x ke hari-H, dihitung dari tanggal di meta (mis. "24 Okt" / "1–3 Nov") terhadap hari ini */
const MONTHS_ID = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const countdown = (meta, year=2026) => {
  const m = meta.match(/(\d{1,2})(?:\s*–\s*\d{1,2})?\s(Jan|Feb|Mar|Apr|Mei|Jun|Jul|Agu|Sep|Okt|Nov|Des)/); if(!m) return '';
  const t = new Date(year, MONTHS_ID.indexOf(m[2]), +m[1]), n = new Date(); n.setHours(0,0,0,0);
  const d = Math.round((t - n)/86400000);
  const label = d>0 ? d+' hari lagi' : d===0 ? 'Hari ini' : 'Selesai';
  return `<span class="absolute top-2 right-2 bg-white border border-neutral-900 rounded px-2 py-1 text-xs font-semibold shadow-sm ${d===0?'!bg-neutral-900 text-white':''}">${label}</span>`;
};

/* ===== Unduh layar sebagai PNG — hanya tampil di Claude (butuh capability downloads) ===== */
let DL = null;
(async () => {
  try { DL = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch(e) { DL = null; }
  if (DL) $('pngBtn').hidden = false;
})();
const slug = t => t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const pngMsg = (t) => { const el=$('pngMsg'); el.textContent=t; el.hidden=!t; if(t) setTimeout(()=>{ if(el.textContent===t) el.hidden=true; }, 4000); };
$('pngBtn').onclick = async () => {
  if (!DL || !window.htmlToImage) { pngMsg('Unduhan PNG belum siap.'); return; }
  const btn = $('pngBtn'); btn.disabled = true; pngMsg('Menyiapkan PNG…');
  try {
    const key = curKey(), idx = String(visibleOrder().indexOf(key)+1).padStart(2,'0');
    const name = `${state.flow}_${idx}-${slug(F().screens[key].title)}_${viewport}.png`;
    const blob = await window.htmlToImage.toBlob($('frame'), { pixelRatio: 2, backgroundColor: '#ffffff', skipFonts: true, cacheBust: true });
    if (!blob) throw { code: 'render' };
    await DL.save({ filename: name, data: blob });
    pngMsg('PNG tersimpan: ' + name);
  } catch (e) {
    pngMsg(e && e.code==='declined' ? '' : e && e.code==='rate_limited' ? 'Tunggu sebentar, lalu coba lagi.' : 'PNG tidak dapat dibuat di tampilan ini.');
  } finally { btn.disabled = false; }
};

  /* close an open ⋮ menu when clicking outside it */
  if(state.bgMenu!=='none' && !e.target.closest('[data-menu]')){ state.bgMenu='none'; if(!e.target.closest('[data-go],[data-set],[data-flow],[data-action]')){ render(); return; } }
  const fl=e.target.closest('[data-flow]'); if(fl){ openFlow(fl.dataset.flow); return; }
  const a=e.target.closest('[data-action]'); if(a){ ACTIONS[a.dataset.action](); return; }
  const g=e.target.closest('[data-go]'); if(g){ const so=g.dataset.setOnGo; if(so){ const [k,v]=so.split(':'); state[k]=v; } go(g.dataset.go); return; }
  const rs=e.target.closest('[data-reset="usr"]'); if(rs){ state.usrRole=state.usrLoc=state.usrStatus='Semua'; render(); return; }
  const bgr=e.target.closest('[data-set="bgReset:1"]'); if(bgr){ state.bgStatus=state.bgPoin='Semua'; render(); return; }
  const arr=e.target.closest('[data-set="arReset:1"]'); if(arr){ state.arSpoke=state.arProg=state.arProgress='Semua'; render(); return; }
  const spr=e.target.closest('[data-set="spReset:1"]'); if(spr){ state.spSek=state.spKeh=state.spSt='Semua'; render(); return; }
  const rr=e.target.closest('[data-set="rpReset:1"]'); if(rr){ state.rpRole=state.rpMode=state.rpHadir='Semua'; render(); return; }
  const st=e.target.closest('[data-set]'); if(st){ const [k,v]=st.dataset.set.split(':'); state[k]=v; if(k==='role') picks={interests:new Set(),needs:new Set()}; render(); return; }
  const c=e.target.closest('[data-chip]'); if(c){ const set=picks[c.dataset.chip]; set.has(c.dataset.val)?set.delete(c.dataset.val):set.add(c.dataset.val); c.setAttribute('aria-pressed',set.has(c.dataset.val)); $('profErr')&&( $('profErr').hidden=true ); return; }
  const ch=e.target.closest('.chip:not([data-chip])'); if(ch){ ch.setAttribute('aria-pressed', ch.getAttribute('aria-pressed')!=='true'); return; }
});
document.addEventListener('change',e=>{
  if(e.target.id==='fConsent' && e.target.checked && $('regErr')) $('regErr').hidden=true;
  if(e.target.id==='pcConsent' && e.target.checked && $('pcErr')) $('pcErr').hidden=true;
  if(e.target.dataset && e.target.dataset.filter){ state[e.target.dataset.filter]=e.target.value; render(); }
});

const startHash=(location.hash||'').slice(1); if(FLOW_DEFS[startHash]) state.flow=startHash;
setViewport('desktop');

</script>
