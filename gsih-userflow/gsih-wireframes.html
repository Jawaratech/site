/* ===== Generic footer: dipasang otomatis di layar ber-header horizontal (lihat withFooter) ===== */

/* Footer otomatis untuk setiap layar ber-header horizontal (appHeader) tanpa sidebar dan bukan mock email.
   Menu footer = menu header layar tsb (+ "Untuk Partner" di header publik); header tanpa menu memakai menu publik. */
const PUBLIC_MENU = ['Program','Event','Lowongan','Riset','Spaces'];
const withFooter = (html) => {
  const isApp = html.includes('<span class="font-semibold">GSIH</span></button>\n    <nav class="hidden md:flex');
  if (!isApp || html.includes('w-48 shrink-0 border-r') || html.includes('Kotak masuk')) return html;
  const m = html.match(/<nav class="hidden md:flex[^>]*>([\s\S]*?)<\/nav>/);
  let menu = m ? [...m[1].matchAll(/<(?:span|button)[^>]*>(.*?)<\/(?:span|button)>/g)].map(x=>x[1]) : [];
  if (!menu.length) menu = PUBLIC_MENU;
  if (menu.join('|') === PUBLIC_MENU.join('|')) menu = [...menu, 'Untuk Partner'];
  return html + siteFooter(menu);
};

  const label = d>0 ? d+' hari lagi' : d===0 ? 'Hari ini' : 'Selesai';
  return `<span class="absolute top-2 right-2 bg-white border border-neutral-900 rounded px-2 py-1 text-xs font-semibold shadow-sm ${d===0?'!bg-neutral-900 text-white':''}">${label}</span>`;

const intItemAttrs = (target, role) => !target ? '' : target==='@dash' ? `data-flow="${INT_DASH_FLOW[role]}" data-flow-screen="dashboard"` : `data-flow="${target.split('/')[0]}" data-flow-screen="${target.split('/')[1]}"`;
/* Semua grup selalu terbuka; hanya grup Pengaturan berupa accordion (terbuka otomatis bila halaman aktif ada di dalamnya) */
const intOpen = (key, def) => { const o = state.intAcc[key]; return o===undefined ? def : o; };
const intSideNav = (role, active) => {
  const act = active && active[0]==='@' ? active.slice(1) : (INT_ALIAS[active] || active);
  const row = (label, target, sub=false, count='') => `<button type="button" ${intItemAttrs(target, role)} class="w-full text-left text-sm ${sub?'pl-6 py-1 text-[13px]':'px-2 py-1.5'} rounded flex items-center gap-2 ${label===act?'bg-neutral-200 font-medium text-neutral-900':'text-neutral-600 hover:bg-neutral-100'} ${target?'':'cursor-default'}"><span class="min-w-0 flex-1">${label}</span>${count?`<span class="font-mono text-[10px] bg-neutral-900 text-white rounded-full px-1.5">${count}</span>`:''}</button>`;
  const chev = (open) => `<span class="font-mono text-[10px] transition-transform ${open?'rotate-90':''}" aria-hidden="true">▸</span>`;
  const can = (l) => typeof raVisible==='function' ? raVisible(role, l) : true;
  return INT_MENU.map(([g, items]) => { const vis = items.filter(i=> g==='Pengaturan' && i[3] ? i[3].some(can) : can(i[0])); if(!vis.length) return '';
    const hasAct = vis.some(([l,,,sub]) => l===act || (sub||[]).includes(act));
    const acc = g==='Pengaturan', gOpen = acc ? intOpen('g:'+g, hasAct) : true;
    const inner = vis.map(([label,,target,sub]) => {
      if (!sub) return row(label, target, false, label==='Daftar Persetujuan' ? {s:'2',h:'5',c:'8',k:'3'}[role] : '');
      if (g==='Pengaturan') return sub.filter(can).map(s=>row(s, INT_SUB_TARGET[s])).join('');
      const sOpen = intOpen('s:'+label, sub.includes(act));
      return `<button type="button" data-acc="s:${label}" aria-expanded="${sOpen}" class="w-full text-left text-sm px-2 py-1.5 rounded flex items-center gap-2 text-neutral-600 hover:bg-neutral-100"><span class="min-w-0 flex-1">${label}</span>${chev(sOpen)}</button>${sOpen ? sub.map(s=>row(s, INT_SUB_TARGET[s], true)).join('') : ''}`;
    }).join('');
    const head = acc ? `<button type="button" data-acc="g:${g}" aria-expanded="${gOpen}" class="w-full flex items-center gap-2 font-mono text-[10px] uppercase tracking-wider text-neutral-500 px-2 py-1.5 rounded hover:bg-neutral-100"><span class="min-w-0 flex-1 text-left">${g}</span>${!gOpen && hasAct ? '<span class="w-1.5 h-1.5 rounded-full bg-neutral-900" aria-hidden="true"></span>' : ''}${chev(gOpen)}</button>`
                     : `<p class="font-mono text-[10px] uppercase tracking-wider text-neutral-500 px-2 mt-2 mb-1">${g}</p>`;
    return `<div class="mb-1">${head}${gOpen ? `<div class="pb-1">${inner}</div>` : ''}</div>`; }).join('');
};

const erData = (ei) => {
  const ev = EV_LIST[ei], n = ev[6]; if (!n) return [];
  const first = ['Sari','Hendra','Rani','Budi','Maya','Agus','Dewi','Fajar','Gita','Irfan','Laras','Nadia','Oki','Putri','Raka','Salsa','Teguh','Vira','Wahyu','Yoga'];

  const roles = ['Startup Founder','Digital Talent','SME Owner','Researcher','Mentor'];
  const done = ev[4]==='Selesai', cur = ev[8], hy = ev[1]==='Hybrid';
  return Array.from({length:n},(_,i)=>{
    const f = first[(i*7+ei)%first.length], l = last[(i*5+ei)%last.length];
    let st = cur ? (i<ev[7]-12 ? 'Diterima' : i%4===0 ? 'Ditolak' : i%5===1 ? 'Daftar tunggu' : 'Menunggu kurasi') : (i%13===6 ? 'Dibatalkan' : 'Terdaftar');

const isEvSec = t => /event|pelatihan/i.test(t), isJobSec = t => /lowongan/i.test(t);
const dashParts = (r) => {
  const job = r.recos.filter(x=>isJobSec(x[0])), ev = r.recos.filter(x=>isEvSec(x[0]) && !job.includes(x)), other = r.recos.filter(x=>!job.includes(x) && !ev.includes(x));
  const P = r.panels(), pJob = P.filter(p=>/<h3[^>]*>Lowongan/.test(p)), pOther = P.filter(p=>!pJob.includes(p));
  return { ev, job, other, pJob, pOther, kpi:[...r.kpi.filter(k=>!isJobSec(k[0])), ...r.kpi.filter(k=>isJobSec(k[0]))] };
};
const panelGrid = (arr) => arr.length ? `<div class="grid gap-4 ${arr.length>1?'md:grid-cols-2':''}">${arr.join('')}</div>` : '';
const recoRows = (arr) => arr.map(x=>recoRow(...x)).join('');

/* Indikator kehadiran event + warning/alert saat menyentuh threshold */
const ATT_TH = { warn:75, alert:50 };   // threshold diatur Core Team
const ATT_SIM = { normal:[8,10], warn:[6,10], alert:[4,10] };
const participationPanel = (id) => {
  const lvl = state.attSim, [a,b] = ATT_SIM[lvl], pct = Math.round(a/b*100), miss = b-a, mentor = id==='mentor';
  const role = mentor ? 'sebagai mentor' : 'yang Anda daftar';
  const bar = `<div class="relative h-2.5 bg-neutral-200 rounded" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Kehadiran event">
      <div class="h-2.5 bg-neutral-900 rounded" style="width:${pct}%"></div>
      ${[ATT_TH.alert, ATT_TH.warn].map(t=>`<span class="absolute bg-neutral-500" style="left:${t}%;top:-4px;width:2px;height:18px" aria-hidden="true"></span>`).join('')}
    </div>
    <div class="relative h-4 mt-2 text-[10px] font-mono text-neutral-500" aria-hidden="true">${[ATT_TH.alert, ATT_TH.warn].map(t=>`<span class="absolute -translate-x-1/2" style="left:${t}%">${t}%</span>`).join('')}</div>`;
  const msg = lvl==='warn'
    ? `<div class="border border-neutral-900 rounded p-3 flex gap-3 items-start text-sm" role="status"><span class="font-mono font-bold" aria-hidden="true">!</span><div class="min-w-0"><p class="font-semibold">Kehadiran Anda di bawah ${ATT_TH.warn}%</p><p class="text-neutral-600">Anda tidak hadir di ${miss} event tanpa membatalkan pendaftaran. Kuota gratis booking space Anda <b>dikurangi 50%</b> (4 dari 8 jam) sampai kehadiran kembali ≥ ${ATT_TH.warn}%. Batalkan lebih awal bila berhalangan (UF-13).</p></div></div>`
    : lvl==='alert'
    ? `<div class="border-2 border-neutral-900 bg-neutral-900 text-white rounded p-3 flex gap-3 items-start text-sm" role="alert"><span class="font-mono font-bold" aria-hidden="true">⚠</span><div class="min-w-0"><p class="font-semibold">Kehadiran Anda di bawah ${ATT_TH.alert}%</p><p class="text-neutral-200">Kuota gratis booking space Anda <b>diblokir</b> sampai kehadiran kembali ≥ ${ATT_TH.alert}%. Hadiri event yang sudah Anda daftar atau batalkan bila berhalangan.</p></div></div>`
    : `<p class="text-xs text-neutral-500">✓ Kehadiran Anda baik. Pertahankan di atas ${ATT_TH.warn}%.</p>`;
  return `
  <section class="border ${lvl==='normal'?'border-neutral-300':'border-neutral-900 border-2'} rounded p-4 flex flex-col gap-3 min-w-0">
    <div class="flex flex-wrap items-center gap-2"><h3 class="text-sm font-semibold">Kehadiran event</h3><span class="ml-auto text-xs underline">Lihat riwayat</span></div>
    ${simBar('Simulasi','attSim',[['normal','≥ 75%'],['warn','50–74% (warning)'],['alert','< 50% (alert)']])}
    <div class="flex flex-col gap-1">
      <p class="flex items-baseline gap-2"><span class="text-3xl font-semibold font-mono">${pct}%</span><span class="text-sm font-medium">kehadiran</span>${lvl!=='normal'?`<span class="ml-auto">${pill(lvl==='warn'?'WARNING':'ALERT', lvl==='alert')}</span>`:''}</p>
      <p class="text-sm text-neutral-600">Hadir di ${a} dari ${b} event ${role}.</p>
    </div>
    <div>${bar}</div>
    ${msg}
  </section>`;
};
const PARTICIPATION_NOTE = ['Kehadiran event','Persentase hadir dari event yang didaftar (dihitung dari check-in UF-16; pembatalan sebelum H-1 lewat UF-13 tidak dihitung). Threshold diatur Core Team, default: < 75% tampil warning, < 50% tampil alert. Konsekuensi: kuota gratis booking space dikurangi 50% (warning) atau diblokir (alert), diatur di Pengaturan › Threshold kehadiran (UF-30). Warning/alert juga dikirim sebagai notifikasi.'];

  const types = ['Coworking','Meeting','Workshop','Event','Coworking','Meeting'];
  const out = []; let day = 1, mon = 11;
  for (let i=0; i<137; i++) {
    if (i>0 && i%11===0) { day--; if (day<1) { day=31; mon=10; } }
    const d = `2026-${String(mon).padStart(2,'0')}-${String(day).padStart(2,'0')}`;

    const st = i%17===5 ? 'Menunggu' : i%23===9 ? 'Ditolak' : 'Disetujui';

  const c=e.target.closest('[data-chip]'); if(c){ const set=picks[c.dataset.chip]; set.has(c.dataset.val)?set.delete(c.dataset.val):set.add(c.dataset.val); c.setAttribute('aria-pressed',set.has(c.dataset.val)); $('profErr')&&( $('profErr').hidden=true ); return; }
  const acc=e.target.closest('[data-acc]'); if(acc){ state.intAcc = {...state.intAcc, [acc.dataset.acc]: acc.getAttribute('aria-expanded')!=='true'}; render(); return; }
  const sl=e.target.closest('[data-slot]'); if(sl){ const box=sl.closest('[data-slots]'), max=+box.dataset.max, on=sl.getAttribute('aria-pressed')==='true', n=box.querySelectorAll('[data-slot][aria-pressed="true"]').length;
    if(!on && n>=max){ $('slotWarn').hidden=false; return; } sl.setAttribute('aria-pressed', !on); const c=n+(on?-1:1); $('slotCount').textContent=c+' jam'; $('slotLeft').textContent=(max-c)+' jam'; $('slotWarn').hidden = c<max; return; }
  const ch=e.target.closest('.chip:not([data-chip])'); if(ch){ ch.setAttribute('aria-pressed', ch.getAttribute('aria-pressed')!=='true'); return; }
});
document.addEventListener('change',e=>{
  if(e.target.id==='fConsent' && e.target.checked && $('regErr')) $('regErr').hidden=true;
  if(e.target.id==='pcConsent' && e.target.checked && $('pcErr')) $('pcErr').hidden=true;

});
