<script type="text/x-dc" data-dc-script>
const PAGES = ['index', 'Revit-Masuk', 'Revit-Aktivasi', 'Revit-SKL-Sekolah', 'Revit-SKL-Data-Sekolah', 'Revit-SKL-Konfirmasi-OCR', 'Revit-SKL-Pelaksanaan', 'Revit-SKL-Perpanjangan', 'Revit-ADM-Kelengkapan', 'Revit-KPR-Konsultan-Perencanaan', 'Revit-PPK-Bendahara', 'Revit-PPK-Penyaluran-Addendum', 'Revit-APV-Approver', 'Revit-KPL-Konsultan-Pelaksanaan', 'Revit-KPL-Detail-Pengawasan', 'Revit-SA-Super-Admin', 'Revit-PIM-Pimpinan', 'Revit-Dashboard', 'Revit-Daftar-Sekolah', 'Revit-Detail-Proposal', 'Revit-Riwayat-Keputusan'];
const fromUrl = () => { const p = new URLSearchParams(location.search).get('p'); return PAGES.includes(p) ? p : 'index'; };

class Component extends DCLogic {
  state = { page: fromUrl() };
  componentDidMount() {
    const geo = document.querySelector('img[data-revit-geo]');
    const gsrc = geo && geo.getAttribute('src');
    if (gsrc && !/indonesia-provinsi-contoh\.json$/.test(gsrc) && !window.__revitFetch) {
      const orig = window.fetch.bind(window);
      const blob = Object.values(window.__resourceBlobs || {}).find((b) => b && /json/.test(b.type || ''));
      window.__revitFetch = true;
      window.fetch = (u, o) => {
        if (typeof u === 'string' && /indonesia-provinsi-contoh\.json$/.test(u)) return blob ? Promise.resolve(new Response(blob, { headers: { 'Content-Type': 'application/json' } })) : orig(geo.src, o);
        return orig(u, o);
      };
    }
    const logo = document.querySelector('img[data-revit-logo]');
    if (logo && !/logo-setneg-ri\.svg$/.test(logo.getAttribute('src') || '')) {
      const fix = () => document.querySelectorAll('img[src$="logo-setneg-ri.svg"]').forEach((im) => { im.src = logo.src; });
      fix();
      this._mo = new MutationObserver(fix);
      this._mo.observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ['src'] });
    }
    window.__revitHub = true;
    window.revitGo = (u) => { if (!this.go(u)) location.assign(u); };
    const rewrite = (a) => {
      const h = a.getAttribute('href'); const m = /^(?:\.\/)?([^#?\/]+)\.dc\.html(?:#(.*))?$/.exec(h || '');
      if (!m || !PAGES.includes(decodeURIComponent(m[1]))) return;
      a.setAttribute('data-dc-href', h);
      a.setAttribute('href', this.hubUrl(decodeURIComponent(m[1]), m[2]));
    };
    const scan = (root) => { if (root.matches && root.matches('a[href]')) rewrite(root); if (root.querySelectorAll) root.querySelectorAll('a[href]').forEach(rewrite); };
    scan(document.body);
    this._amo = new MutationObserver((list) => list.forEach((r) => { if (r.type === 'attributes') rewrite(r.target); else r.addedNodes.forEach((n) => n.nodeType === 1 && scan(n)); }));
    this._amo.observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ['href'] });
    this._click = (e) => {
      if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      const a = e.target && e.target.closest && e.target.closest('a[href]');
      if (!a || (a.target && a.target !== '_self')) return;
      if (this.go(a.getAttribute('data-dc-href') || a.getAttribute('href'))) e.preventDefault();
    };
    this._pop = () => this.setState({ page: fromUrl() });
    document.addEventListener('click', this._click);
    window.addEventListener('popstate', this._pop);
  }
  hubUrl(name, hash) { return (name === 'index' ? location.pathname : '?p=' + encodeURIComponent(name)) + (hash ? '#' + hash : ''); }
  componentWillUnmount() { if (this._mo) this._mo.disconnect(); if (this._amo) this._amo.disconnect(); document.removeEventListener('click', this._click); window.removeEventListener('popstate', this._pop); }
  go(u) {
    let m = /^(?:\.\/)?([^#?\/]+)\.dc\.html(?:#(.*))?$/.exec(u || '');
    if (!m) { const q = /^\?p=([^#]+)(?:#(.*))?$/.exec(u || ''); if (q) m = [u, q[1], q[2]]; }
    if (!m) return false;
    const name = decodeURIComponent(m[1]);
    if (!PAGES.includes(name)) return false;
    history.pushState(null, '', this.hubUrl(name, m[2]));
    if (name === this.state.page) this.setState({ page: null }, () => this.setState({ page: name }));
    else this.setState({ page: name });
    window.scrollTo(0, 0);
    return true;
  }
  renderVals() {
    const i = PAGES.indexOf(this.state.page);
    return { is: Object.fromEntries(PAGES.map((_, n) => ['p' + n, n === i])) };
  }
}
</script>
